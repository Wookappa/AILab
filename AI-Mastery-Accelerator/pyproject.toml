[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mastery-accelerator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ai = [
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
]
rag = [
  "rank-bm25>=0.2,<1",
  "sentence-transformers>=3,<6",
]
platform = [
  "dbt-duckdb>=1.9,<2",
  "dlt[duckdb]>=1,<2",
  "mcp>=1,<2",
]
mlops = [
  "mlflow>=3,<4",
]
ops = [
  "opentelemetry-api>=1,<2",
  "opentelemetry-sdk>=1,<2",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
