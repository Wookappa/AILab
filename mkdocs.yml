site_name: AI Mastery Accelerator
site_description: Percorso intensivo per diventare AI/ML Engineer production-ready
site_url: https://wookappa.github.io/AILab/
repo_url: https://github.com/wookappa/AILab
repo_name: wookappa/AILab
edit_uri: edit/main/AI-Mastery-Accelerator/
docs_dir: AI-Mastery-Accelerator
site_dir: site

theme:
  name: material
  language: it
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro

nav:
  - Home: README.md
  - Copertura posizione: JOB-MATCH.md
  - Corso:
      - "00 - Setup e metodo": 00-setup/README.md
      - "01 - Python production-grade": 01-python-production/README.md
      - "02 - ML end-to-end": 02-ml-production/README.md
      - "03 - LLM e Transformer": 03-llm-foundations/README.md
      - "04 - RAG": 04-rag/README.md
      - "05 - Agenti e LangGraph": 05-agents/README.md
      - "06 - Data platform e MCP": 06-data-platform-mcp/README.md
      - "07 - LLMOps e deploy": 07-llmops-deployment/README.md
      - "08 - Capstone": 08-capstone/README.md
      - "09 - Colloquio e mastery": 09-interview/README.md

plugins:
  - search:
      lang: it

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
