site_name: AI Mastery Accelerator
site_description: Percorso intensivo per diventare AI/ML Engineer production-ready
site_url: https://wookappa.github.io/AILab/
repo_url: https://github.com/wookappa/AILab
repo_name: wookappa/AILab
edit_uri: edit/main/AI-Mastery-Accelerator/
docs_dir: AI-Mastery-Accelerator
site_dir: site
exclude_docs: |
  .venv*/
  .*_cache/
  src/
  tests/
  examples/

theme:
  name: material
  language: it
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro

nav:
  - Inizia qui: README.md
  - Percorso completo: PERCORSO.md
  - Glossario: GLOSSARIO.md
  - Copertura posizione: JOB-MATCH.md
  - Corso:
      - "00 - Setup e metodo":
          - Lezione passo-passo: 00-setup/LEZIONE.md
          - Approfondimento tecnico: 00-setup/GUIDA.md
          - Checklist finale: 00-setup/README.md
      - "01 - Python production-grade":
          - Lezione passo-passo: 01-python-production/LEZIONE.md
          - Approfondimento tecnico: 01-python-production/GUIDA.md
          - Checklist finale: 01-python-production/README.md
      - "02 - ML end-to-end":
          - Lezione passo-passo: 02-ml-production/LEZIONE.md
          - Approfondimento tecnico: 02-ml-production/GUIDA.md
          - Checklist finale: 02-ml-production/README.md
      - "02B - Deep Learning e Computer Vision":
          - Lezione passo-passo: 02b-deep-learning-vision/LEZIONE.md
          - Approfondimento tecnico: 02b-deep-learning-vision/GUIDA.md
          - Checklist finale: 02b-deep-learning-vision/README.md
      - "03 - LLM e Transformer":
          - Lezione passo-passo: 03-llm-foundations/LEZIONE.md
          - Approfondimento tecnico: 03-llm-foundations/GUIDA.md
          - Checklist finale: 03-llm-foundations/README.md
      - "04 - RAG":
          - Lezione passo-passo: 04-rag/LEZIONE.md
          - Approfondimento tecnico: 04-rag/GUIDA.md
          - Checklist finale: 04-rag/README.md
      - "05 - Agenti e LangGraph":
          - Lezione passo-passo: 05-agents/LEZIONE.md
          - Approfondimento tecnico: 05-agents/GUIDA.md
          - Checklist finale: 05-agents/README.md
      - "06 - Data platform e MCP":
          - Lezione passo-passo: 06-data-platform-mcp/LEZIONE.md
          - Approfondimento tecnico: 06-data-platform-mcp/GUIDA.md
          - Checklist finale: 06-data-platform-mcp/README.md
      - "07 - LLMOps e deploy":
          - Lezione passo-passo: 07-llmops-deployment/LEZIONE.md
          - Approfondimento tecnico: 07-llmops-deployment/GUIDA.md
          - Laboratorio infrastruttura: 07-llmops-deployment/INFRA.md
          - Checklist finale: 07-llmops-deployment/README.md
      - "08 - Capstone":
          - Lezione passo-passo: 08-capstone/LEZIONE.md
          - Implementazione tecnica: 08-capstone/PIANO.md
          - Checklist finale: 08-capstone/README.md
      - "09 - Colloquio e mastery":
          - Lezione passo-passo: 09-interview/LEZIONE.md
          - Risposte modello: 09-interview/README.md

plugins:
  - search:
      lang: it

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
